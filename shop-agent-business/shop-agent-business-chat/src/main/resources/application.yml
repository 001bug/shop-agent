spring:
  application:
    name: shop-agent
  datasource:
    url: jdbc:mysql://localhost:3306/shop_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

shop:
  storage:
    minio:



  framework:
    # Set to true after spring.data.redis has been configured to enable Redisson locks, leases and delay queues.
    redisson:
      enabled: false
    # Set to true after spring.data.redis has been configured to enable distributed ID generation.
    id-generator:
      enabled: ${SHOP_AGENT_ID_GENERATOR_ENABLED:false}
